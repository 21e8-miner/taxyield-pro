name: Update Yields

# 9:00 America/New_York ≈ 13:00 UTC (EDT) / 14:00 UTC (EST).
# Run weekdays so the desk is fresh each morning; manual run anytime.
on:
  schedule:
    - cron: "0 13 * * 1-5" # ~9am Eastern during daylight time
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this?"
        required: false
        default: "manual desk refresh"

permissions:
  contents: write

concurrency:
  group: update-yields
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40" "pandas>=2.0"

      - name: Update yields & prices
        run: python scripts/update_yields.py

      - name: Commit & push if changed
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/funds.json
          if git diff --staged --quiet; then
            echo "No fund data changes to commit."
            exit 0
          fi
          git commit -m "chore: update yields and prices ($(date -u +%Y-%m-%d))"
          git push
