name: Update Yields

on:
  schedule:
    - cron: "0 13 * * 1-5" # ~9am Eastern (EDT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taxyield-update-yields
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40" "pandas>=2.0"
      - name: Update yields & prices
        run: python scripts/update_yields.py
      - name: Commit & push if changed
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/funds.json
          if git diff --staged --quiet; then
            echo "No fund data changes."
            exit 0
          fi
          git commit -m "chore: update yields and prices ($(date -u +%Y-%m-%d))"
          git push
